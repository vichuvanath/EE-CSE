$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/reset-password"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "access_token": "string",
        "new_password": "newsecurepassword123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
order: 1000
