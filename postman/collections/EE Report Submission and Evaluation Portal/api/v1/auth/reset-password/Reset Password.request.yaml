$kind: http-request
description: Resets user password securely.
url: "{{baseUrl}}/api/v1/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "access_token": "string",
      "new_password": "newsecurepassword123"
    }
settings: {}
examples: ./.resources/Reset Password.resources/examples
order: 1000
