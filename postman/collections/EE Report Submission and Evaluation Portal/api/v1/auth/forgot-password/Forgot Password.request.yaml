$kind: http-request
description: |-
  Triggers Supabase password reset flow.
  Returns a generic message to prevent account enumeration.
url: "{{baseUrl}}/api/v1/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "student@university.edu"
    }
settings: {}
examples: ./.resources/Forgot Password.resources/examples
order: 1000
