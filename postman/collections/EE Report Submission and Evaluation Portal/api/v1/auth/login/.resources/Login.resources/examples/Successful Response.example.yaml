$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "student@university.edu",
        "password": "password123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "access_token": "string",
        "refresh_token": "string",
        "expires_in": 7072,
        "user": {
          "id": "string",
          "email": "string",
          "full_name": "string",
          "role": "string",
          "is_active": true
        },
        "token_type": "bearer"
      }
order: 1000
