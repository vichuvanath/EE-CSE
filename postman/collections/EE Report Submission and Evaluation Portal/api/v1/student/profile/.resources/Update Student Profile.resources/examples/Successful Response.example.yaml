$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/student/profile"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "phone_number": null
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "user_id": "string",
        "email": "string",
        "full_name": "string",
        "roll_number": "string",
        "department": "string",
        "batch": "string",
        "is_active": true,
        "phone_number": null
      }
order: 1000
