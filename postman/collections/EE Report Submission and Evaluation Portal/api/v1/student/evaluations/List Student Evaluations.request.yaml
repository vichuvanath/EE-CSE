$kind: http-request
description: |-
  List released evaluations for the authenticated student's team submissions.
  STRICT PRIVACY: Unreleased or draft evaluations are completely hidden.
url: "{{baseUrl}}/api/v1/student/evaluations"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/List Student Evaluations.resources/examples
order: 2000
