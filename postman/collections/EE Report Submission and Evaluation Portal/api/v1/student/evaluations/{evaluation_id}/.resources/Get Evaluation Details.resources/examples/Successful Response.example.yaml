$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/student/evaluations/:evaluation_id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    evaluation_id: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "submission_id": "string",
        "created_at": "1976-07-05T07:25:55.365Z",
        "feedback": "string",
        "total_score": 7191.025413307243
      }
order: 1000
