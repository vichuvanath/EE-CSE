$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/student/submissions"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "title": "EE401 Interim Progress Report",
        "description": "Detailed report covering system design",
        "submission_type": "interim_report"
      }
