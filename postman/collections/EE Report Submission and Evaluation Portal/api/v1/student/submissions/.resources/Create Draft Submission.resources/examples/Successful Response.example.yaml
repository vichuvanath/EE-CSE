    content: |-
      {
        "id": "string",
        "project_id": "string",
        "team_id": "string",
        "title": "string",
        "submission_type": "string",
        "status": "string",
        "created_at": "2006-04-21T12:07:21.197Z",
        "updated_at": "1956-06-12T17:55:25.972Z",
        "submitted_by": "string",
        "description": "string"
      }
order: 1000
