$kind: http-request
description: List all submissions belonging to the authenticated student's team/project.
url: "{{baseUrl}}/api/v1/student/submissions"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/List Student Submissions.resources/examples
order: 2000
