$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/student/submissions/:submission_id/files"
  method: POST
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    submission_id: string
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: []
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "submission_id": "string",
        "file_name": "string",
        "file_size": 3618,
        "mime_type": "string",
        "storage_bucket": "string",
        "created_at": "1968-05-18T03:59:02.076Z",
        "download_url": "string"
      }
order: 1000
