$kind: http-request
description: |-
  Unified dashboard endpoint for the Student Portal.
  Aggregates profile, team, project, deadlines, submissions, notifications, evaluations, and announcements.
url: "{{baseUrl}}/api/v1/student/dashboard"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Get Student Dashboard.resources/examples
order: 1000
