$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/student/notifications/:notification_id/read"
  method: PATCH
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    notification_id: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "title": "string",
        "message": "string",
        "notification_type": "string",
        "is_read": true,
        "created_at": "1988-01-03T07:31:16.797Z"
      }
order: 1000
