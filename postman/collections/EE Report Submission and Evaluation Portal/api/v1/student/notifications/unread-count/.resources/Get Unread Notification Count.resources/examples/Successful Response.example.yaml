$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/student/notifications/unread-count"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "unread_count": 4026
      }
order: 1000
