$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/student/announcements/:announcement_id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    announcement_id: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "title": "string",
        "content": "string",
        "created_at": "1994-10-10T18:21:13.876Z",
        "is_read": false
      }
order: 1000
